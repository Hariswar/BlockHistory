# Every Monday: lint, tests, the website's typecheck, and the live site against the saved
# answers in evals/live.json (scripts/check_live.py). A failure opens an issue (or comments
# on the open one), which GitHub emails to the repo owner. The site's /status page shows the
# last run. Run it by hand from the Actions tab ("Run workflow").
# GitHub pauses scheduled workflows after 60 days without a commit; re-enable it there.
name: weekly

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC (8-9 am in St. Louis)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,vision]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Website typecheck
        working-directory: web
        run: npm ci && npm run typecheck

      - name: Live site
        run: python scripts/check_live.py

      - name: Open an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "weekly-check",
            });
            const body = `The weekly check failed: ${run}`;
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: "Weekly check failed", body, labels: ["weekly-check"],
              });
            }
